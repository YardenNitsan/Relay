name: Verify host and browser
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-05
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check (Windows native account ownership)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/windows-test-token.ps1 -Command npm.cmd -CommandArguments @('run', 'check')
      - name: Check
        if: runner.os != 'Windows'
        run: npm run check
      - run: npm run build

  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser acceptance (Windows native account ownership)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/windows-test-token.ps1 -Command npm.cmd -CommandArguments @('run', 'test:e2e', '--', '--shard=${{ matrix.shard }}/3')
      - name: Browser acceptance
        if: runner.os != 'Windows'
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-${{ matrix.os }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
