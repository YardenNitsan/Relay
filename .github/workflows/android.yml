name: Verify native Android
on:
  push:
    paths: ['android/**', 'scripts/native-lan-fixture.ts', 'server/**', 'shared/**', 'package*.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'scripts/native-lan-fixture.ts', 'server/**', 'shared/**', 'package*.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Use runner JDK 21 and official Android SDK
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - name: Install isolated host test dependencies
        run: npm ci
      - name: Verify wrapper and build testing application
        env:
          RELAY_NATIVE_INTEGRATION: '1'
        working-directory: android
        shell: bash
        run: |
          sha256sum --check gradle/wrapper/gradle-wrapper.jar.sha256
          bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Test and lint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-verification
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
      # CI debug keys are ephemeral. Distributable upgrades must use the owner's
      # established testing identity or an explicitly provisioned release signer.
